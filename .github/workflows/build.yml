name: Build UAPMD APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libadwaita-1-dev libsdl2-dev

      - name: Publish aap-core to Maven Local
        working-directory: external/aap-core
        run: |
          chmod +x ./gradlew
          ./gradlew :androidaudioplugin:publishToMavenLocal

      - name: Publish aap-ara to Maven Local
        working-directory: external/aap-ara
        run: |
          chmod +x ./gradlew
          ./gradlew :androidaudioplugin-ara:publishToMavenLocal

      - name: Build Android APK
        working-directory: kotlin
        run: |
          chmod +x ./gradlew
          ./gradlew :uapmd-cmp:assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uapmd-android-apk
          path: kotlin/uapmd-cmp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
